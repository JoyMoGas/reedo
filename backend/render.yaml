services:
  - type: web
    name: reedo-backend
    runtime: python
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    # migrate corre aquí: tiene acceso garantizado a la DB en runtime
    startCommand: "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT core.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        sync: false          # Ingresar manualmente en el dashboard de Render
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false          # Ingresar manualmente en el dashboard de Render (con ?sslmode=require)
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: HARDCOVER_API_TOKEN
        sync: false
    healthCheckPath: /api/health/
