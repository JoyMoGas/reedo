name: EAS Update (Producción)

# Esto define cuándo se ejecuta el workflow. 
# En este caso, cuando haces un push a la rama 'main'.
on:
  push:
    branches:
      - main

# Como tu proyecto Expo está dentro de la carpeta 'mobile', 
# le decimos a todos los pasos que se ejecuten allí por defecto.
defaults:
  run:
    working-directory: ./mobile

jobs:
  update:
    name: Publicar Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Descargar el código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: 'pnpm'
          cache-dependency-path: ./mobile/pnpm-lock.yaml

      - name: 📦 Instalar dependencias
        run: pnpm install

      - name: 🚀 Configurar Expo y EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Toma el token de los secretos

      - name: 📢 Publicar Update en Expo
        # Mensaje estático para evitar errores de sintaxis con los saltos de línea de los commits
        run: eas update --auto --channel production --message "Actualización auto desde CI"
