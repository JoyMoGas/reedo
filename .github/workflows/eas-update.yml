name: EAS Update (Producción)

# Esto define cuándo se ejecuta el workflow. 
# En este caso, cuando haces un push a la rama 'main'.
on:
  push:
    branches:
      - main
    # Se ejecuta si hay cambios en 'mobile' o en este workflow
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'
  # Permite ejecutar el workflow manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:


# Como tu proyecto Expo está dentro de la carpeta 'mobile', 
# le decimos a todos los pasos que se ejecuten allí por defecto.
defaults:
  run:
    working-directory: ./mobile

jobs:
  update:
    name: Publicar Update
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL || 'https://reedo-backend.onrender.com' }}
      EXPO_PUBLIC_API_PORT: ${{ secrets.EXPO_PUBLIC_API_PORT || vars.EXPO_PUBLIC_API_PORT || '' }}
    steps:
      - name: 🏗 Descargar el código
        uses: actions/checkout@v4

      - name: 📝 Crear variables de entorno para producción
        run: |
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > .env
          echo "EXPO_PUBLIC_API_PORT=$EXPO_PUBLIC_API_PORT" >> .env


      - name: ⚙️ Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: 'pnpm'
          cache-dependency-path: ./mobile/pnpm-lock.yaml

      - name: 📦 Instalar dependencias
        run: pnpm install

      - name: 🚀 Configurar Expo y EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Toma el token de los secretos

      - name: 📢 Publicar Update en Expo
        # Publica directo al canal preview sin desviar la rama por --auto
        run: eas update --channel preview --platform android --message "Actualización auto desde CI"


