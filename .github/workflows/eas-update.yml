name: EAS Update (Producción)

# Esto define cuándo se ejecuta el workflow. 
# En este caso, cuando haces un push a la rama 'main'.
on:
  push:
    branches:
      - main

# Como tu proyecto Expo está dentro de la carpeta 'mobile', 
# le decimos a todos los pasos que se ejecuten allí por defecto.
defaults:
  run:
    working-directory: ./mobile

jobs:
  update:
    name: Publicar Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Descargar el código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: 'npm'
          cache-dependency-path: ./mobile/package-lock.json

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🚀 Configurar Expo y EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Toma el token de los secretos

      - name: 📢 Publicar Update en Expo
        # Publicamos un update en el canal de production (o cambia 'production' por 'preview')
        run: eas update --auto --channel production --message "Actualización auto: ${{ github.event.head_commit.message }}"
